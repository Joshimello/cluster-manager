# Optional one-time setup. Run with: docker compose -f docker-compose.yml -f docker-compose.updater.yml up -d
# DEPLOYMENT_DIRECTORY must be the absolute host checkout path (same path inside the helper).
services:
  platform:
    environment:
      PLATFORM_UPDATER_TOKEN: ${PLATFORM_UPDATER_TOKEN:?set a random 64-character hex token}
  updater:
    image: ghcr.io/joshimello/cluster-manager-platform:updater-${UPDATER_VERSION:?pin the updater release}
    restart: unless-stopped
    init: true
    environment:
      PLATFORM_URL: http://platform:3000
      PLATFORM_UPDATER_TOKEN: ${PLATFORM_UPDATER_TOKEN:?set a random 64-character hex token}
      DEPLOYMENT_DIRECTORY: ${DEPLOYMENT_DIRECTORY:?set the absolute host deployment directory}
      DEPLOYMENT_PROJECT: ${COMPOSE_PROJECT_NAME:-cluster-manager}
      DEPLOYMENT_COMPOSE_FILE: docker-compose.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DEPLOYMENT_DIRECTORY:?set the absolute host deployment directory}:${DEPLOYMENT_DIRECTORY:?set the absolute host deployment directory}
      - platform-updater-state:/state
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
volumes:
  platform-updater-state:
