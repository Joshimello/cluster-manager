name: Node CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  platform-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cluster_manager
          POSTGRES_USER: cluster_manager
          POSTGRES_PASSWORD: cluster_manager_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cluster_manager -d cluster_manager"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://cluster_manager:cluster_manager_ci@localhost:5432/cluster_manager
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - working-directory: platform
        run: npm ci
      - working-directory: platform
        run: npm run db:migrate:runtime
      - working-directory: platform
        run: npm run db:check
      - working-directory: platform
        run: npm test
      - working-directory: platform
        run: npm run check
      - working-directory: platform
        run: npm run lint
      - working-directory: platform
        run: npm run build
      - working-directory: platform
        run: npm run test:identity-db-smoke
      - working-directory: platform
        run: npm run test:database

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Go tests
        working-directory: node
        run: go test ./...
      - name: Go vet
        working-directory: node
        run: go vet ./...
      - name: Shell checks
        run: |
          bash -n install-node.sh
          bash -n node/integration/shared_posix_test.sh
          shellcheck install-node.sh
          shellcheck node/integration/shared_posix_test.sh
      - name: Ubuntu reconciliation test
        run: make test-ubuntu-reconcile
      - name: Ubuntu deployment rehearsal
        run: make test-ubuntu-deploy
      - name: Debian deployment rehearsal
        run: make test-debian-deploy
      - name: Dual-client shared POSIX identity test
        run: make test-shared-posix

  platform-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [platform-test, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish main platform image
        uses: docker/build-push-action@v6
        with:
          context: ./platform
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/joshimello/cluster-manager-platform:main
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=platform-image
          cache-to: type=gha,mode=max,scope=platform-image
