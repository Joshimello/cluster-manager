name: Release cluster-node

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cluster_manager
          POSTGRES_USER: cluster_manager
          POSTGRES_PASSWORD: cluster_manager_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cluster_manager -d cluster_manager"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://cluster_manager:cluster_manager_ci@localhost:5432/cluster_manager
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - working-directory: platform
        run: npm ci
      - working-directory: platform
        run: npm run db:migrate:runtime
      - working-directory: platform
        run: npm run db:check
      - working-directory: platform
        run: npm test
      - working-directory: platform
        run: npm run check
      - working-directory: platform
        run: npm run lint
      - working-directory: platform
        run: npm run build
      - working-directory: platform
        run: npm run test:m8-2-db-smoke
      - working-directory: platform
        run: npm run test:maintenance-db
      - working-directory: node
        run: go test ./...
      - working-directory: node
        run: go vet ./...
      - run: |
          bash -n install-node.sh
          bash -n node/integration/shared_posix_test.sh
          shellcheck install-node.sh
          shellcheck node/integration/shared_posix_test.sh
      - run: make test-ubuntu-reconcile
      - run: make test-ubuntu-deploy
      - run: make test-debian-deploy
      - run: make test-shared-posix

  build:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Build ${{ matrix.arch }}
        working-directory: node
        env:
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
        run: |
          CGO_ENABLED=0 GOOS=linux go build -trimpath \
            -ldflags="-s -w -X github.com/Joshimello/cluster-manager/node/internal/buildinfo.Version=${VERSION}" \
            -o "cluster-node-linux-${GOARCH}" ./cmd/cluster-node
      - uses: actions/upload-artifact@v7
        with:
          name: cluster-node-linux-${{ matrix.arch }}
          path: node/cluster-node-linux-${{ matrix.arch }}

  platform-image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish release platform image
        uses: docker/build-push-action@v6
        with:
          context: ./platform
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/joshimello/cluster-manager-platform:${{ github.ref_name }}
            ghcr.io/joshimello/cluster-manager-platform:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=platform-image
          cache-to: type=gha,mode=max,scope=platform-image

  release:
    needs: [build, platform-image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cluster-node-linux-*
          merge-multiple: true
          path: release
      - name: Prepare verified release assets
        run: |
          cp install-node.sh release/install-node.sh
          cd release
          sha256sum cluster-node-linux-amd64 cluster-node-linux-arm64 install-node.sh > checksums.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes
